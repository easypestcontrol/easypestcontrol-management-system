<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PestOps Field</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1B2E65; color: #fff; font-family: system-ui, sans-serif; text-align: center; }
    .card { padding: 32px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 14px; opacity: .8; margin: 4px 0; }
    .dot { color: #FF0000; font-weight: 700; }
  </style>
</head>
<body>
  <!-- Shown only if the server is unreachable — normally the app goes
       straight to the live PestOps field experience. -->
  <div class="card">
    <h1>PestOps <span class="dot">Field</span></h1>
    <p>Cannot reach the PestOps server.</p>
    <p>Check the Wi-Fi and that the server is running, then reopen the app.</p>
  </div>
</body>
</html>
