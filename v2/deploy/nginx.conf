# PestOps behind nginx on the VPS.
#
#   /etc/nginx/sites-available/pestops  →  symlink into sites-enabled
#   certbot rewrites both blocks for HTTPS:
#     sudo certbot --nginx -d app.yourdomain.com -d api.yourdomain.com
#
# Two server blocks, because the front end may live somewhere else.
#
#   app.yourdomain.com  → the Next.js container on this box
#   api.yourdomain.com  → the NestJS container
#
# If you deploy the front end to Vercel, the first block is unused and the
# second is what Vercel talks to. Keep it anyway: it costs nothing and it means
# the VPS can serve the whole app if Vercel is ever in the way.

# ----------------------------------------------------------------- the app
server {
    listen 80;
    server_name app.yourdomain.com;

    client_max_body_size 16m;   # logos, signatures and job photos as data URLs

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ----------------------------------------------------------------- the API
#
# Reachable from the public internet because Vercel has to call it. The browser
# never does: Next rewrites /api server-side, so requests go Vercel → here, and
# no API key or token is ever exposed to a browser. That also means no CORS
# headers are needed — and none are set, deliberately. If you find yourself
# adding `Access-Control-Allow-Origin: *` here, something has gone wrong
# upstream and the fix is there, not a wildcard.
server {
    listen 80;
    server_name api.yourdomain.com;

    client_max_body_size 16m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
